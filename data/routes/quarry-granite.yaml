id: quarry-granite
kind: route
label: Quarrying granite by pounding
achieves: { thing: granite }
techniques: [stone-dressing]
requires:
  - { role: consumed, thing: granite-outcrop }
  - role: action
    verb: shape
    target: granite
    notes: Trenches are pounded around a block until it can be freed from the bedrock.
outputs:
  - { thing: granite }
notes: How the Aswan quarries worked. Granite boulders lying loose at the surface could be used without quarrying; that route isn't recorded yet.
references:
  - citation: "Marčiš, M. & Fraštia, M. (2023). The problems of the obelisk revisited: Photogrammetric measurement of the speed of quarrying granite using dolerite pounders. Digital Applications in Archaeology and Cultural Heritage 30, e00284."
    doi: 10.1016/j.daach.2023.e00284
    supports: Granite was quarried at Aswan by pounding with dolerite pounders.
    status: secondary
  - citation: "Clarke, S. & Engelbach, R. (1930). Ancient Egyptian Masonry: The Building Craft. Oxford University Press."
    supports: Dolerite pounders used to quarry granite at Aswan.
    status: unverified
