id: cut-abrasive-saw
kind: route
label: Abrasive sawing
achieves: { verb: cut }
techniques: [abrasive-cutting]
requires:
  - { role: tool, category: saw, notes: The blade can be softer than the stone; copper works. }
  - role: consumed
    category: abrasive
    where:
      - { quantity: hardness_mohs, op: ">=", value: target.hardness_mohs }
    notes: The abrasive grains do the cutting, so they must be at least as hard as the stone.
envelope:
  rate:
    quantity: removal_rate_cm3_per_h
    crew: 2
    basis: measured
    by_target:
      - target: granite
        value: [12, 24]
        basis: measured
        notes: 12 cm³/hour measured by Stocks; 24 is his estimate for experienced sawyers.
      - target: limestone
        value: [180, 360]
        basis: derived
        notes: About 15 times the granite rate, per Stocks.
  precision:
    basis: unknown
    notes: Stocks reports no tolerance. In his test the blade rocked side to side and cut a V-shaped slot. Ancient cut faces need to be measured to fill this in (TODO-source).
references:
  - citation: "Stocks, D. A. (2001). Testing ancient Egyptian granite-working methods in Aswan, Upper Egypt. Antiquity 75, 89–94."
    doi: 10.1017/S0003598X00052777
    url: https://www.hallofmaat.com/unforbiddengeology/ancient-egyptian-copper-slabbing-saws/
    supports: "Sawing granite with a copper blade and sand: about 12 cm³/hour, wet or dry, with two workers; Stocks suggested experience could double the rate; the slot came out V-shaped."
    status: secondary
  - citation: "Stocks, D. A. (1999). Stone sarcophagus manufacture in ancient Egypt. Antiquity 73, 918–922."
    url: https://www.hallofmaat.com/unforbiddengeology/ancient-egyptian-copper-slabbing-saws/
    supports: Limestone was cut about 15 times faster than granite.
    status: secondary
