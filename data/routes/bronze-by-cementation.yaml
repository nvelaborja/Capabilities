id: bronze-by-cementation
kind: route
label: Alloying copper with tin ore (cementation)
achieves: { thing: tin-bronze }
requires:
  - { role: consumed, thing: copper }
  - { role: consumed, category: tin-ore }
  - { role: consumed, category: carbon-source }
  - { role: tool, thing: crucible }
  - role: effect
    effect: heat
    where:
      - { quantity: temperature_c, op: ">=", value: 1085 }
  - { role: know_how, thing: alloying }
outputs:
  - { thing: tin-bronze }
notes: Tin ore is reduced directly into molten copper under charcoal, so tin metal is never needed. This is why having bronze does not prove someone could smelt tin.
references:
  - citation: "Tylecote, R. F. (1992). A History of Metallurgy, 2nd ed. Institute of Materials."
    supports: General description of this process.
    status: unverified
