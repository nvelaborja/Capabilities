version: 2

sources:
  - name: raw
    description: Tables loaded by the build before dbt runs.
    tables:
      - name: curated_documents
        description: Every curated YAML document, whole, in the order it was read (the curated layer, ADR 0034).
        columns:
          - name: ordinal
            data_tests: [unique, not_null]
          - name: node_type
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [quantity, thing, verb, route, profile, job, override, date]
          - name: id
            data_tests: [not_null]
          - name: path
            data_tests: [unique, not_null]
      - name: mrds_sources
        description: >
          The crosswalk from MRDS deposits to our source kinds (data/crosswalks/mrds_sources.csv, ADR 0041). A deposit
          is an occurrence of a source kind when its ore minerals (field `ore`) or commodities (field `commodity`)
          include the value, and, when deposit_type is set, its deposit type contains it.
        columns:
          - name: source_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_curated__documents')
                    field: id
          - name: field
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [ore, commodity]
          - name: value
            data_tests: [not_null]
          - name: notes
            data_tests: [not_null]
      - name: mrds_deposits
        description: >
          The USGS Mineral Resources Data System (MRDS) as downloaded, every column as text (ADR 0041). Empty when no
          snapshot has been downloaded.
        columns:
          - name: dep_id
            data_tests: [unique, not_null]
      - name: pleiades_sources
        description: >
          Rules matching Pleiades mines and quarries to our sources and ore classes (data/crosswalks/pleiades_sources.csv,
          ADR 0046). A place matches a rule when it is of the rule's kind (mine or quarry) and its title or description
          names the word, whole. A rule's target is a source, or an ore class when the place doesn't say which ore.
        columns:
          - name: target
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_curated__documents')
                    field: id
          - name: places
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [mine, quarry]
          - name: word
            data_tests: [not_null]
          - name: notes
            data_tests: [not_null]
      - name: pleiades_places
        description: >
          Every place in Pleiades, the gazetteer of ancient places, as downloaded from its daily dump, every column as
          text (ADR 0046). CC BY 3.0.
        columns:
          - name: id
            data_tests: [unique, not_null]
      - name: pleiades_periods
        description: >
          Pleiades' vocabulary of time periods, read from its Turtle (ADR 0051): each period's key, as places name it in
          `timePeriodsKeys`, its label and scope note, and the years the note gives (negative is BCE). A period whose
          note gives no years has none. CC BY 3.0.
        columns:
          - name: key
            data_tests: [unique, not_null]
          - name: label
            data_tests: [not_null]
      - name: cliopatria_polities
        description: >
          Cliopatria, Seshat's borders of the world's polities from 3400 BCE to 2024 CE, as downloaded from its latest
          release (ADR 0052): one row per entity and range of years (FromYear to ToYear, inclusive, negative BCE), its
          properties as text and its polygons as WKB. CC BY 4.0.
        columns:
          - name: Name
            data_tests: [not_null]
          - name: FromYear
            data_tests: [not_null]
          - name: ToYear
            data_tests: [not_null]
          - name: geometry
            data_tests: [not_null]
      - name: wikidata_things
        description: >
          The crosswalk from our things to Wikidata items (data/crosswalks/wikidata_things.csv, ADR 0043). It says which
          item's statements a thing's quantities are read from.
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: ref('stg_curated__documents')
                    field: id
          - name: wikidata
            data_tests: [unique, not_null]
          - name: notes
            data_tests: [not_null]
      - name: ore_minerals
        description: >
          Ore minerals that join the graph from upstream (data/crosswalks/ore_minerals.csv, ADR 0045): each row's
          Wikidata item, MRDS name, ore class, the curated route it is mined like, and the reference for its class,
          with the run that proposed it when an agent did (ADR 0048). Rows with class none were reviewed and
          rejected, and build nothing.
        columns:
          - name: id
            data_tests: [unique]
          - name: wikidata
            data_tests: [unique, not_null]
          - name: mrds_ore
            data_tests: [unique, not_null]
          - name: class
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [copper-ore, copper-sulphide-ore, iron-ore, tin-ore, none]
          - name: citation
            data_tests: [not_null]
          - name: supports
            data_tests: [not_null]
          - name: quote
            description: The passage of the cited work that supports the row, word for word (ADR 0048).
          - name: status
            description: How far the reference has been checked; empty means unverified (ADR 0047).
            data_tests:
              - accepted_values:
                  arguments:
                    values: [unverified, secondary, verified]
          - name: proposed_by
            description: >
              The agent run that proposed the row, whose summary is data/agent_runs/<run>.json; empty for a row a
              person wrote (ADR 0048).
      - name: wikidata_items
        description: >
          The English label and description, and the chemical formula, of every crosswalked Wikidata item, as the
          SPARQL query returned them (ADR 0045).
        columns:
          - name: item
            data_tests: [not_null]
      - name: wikidata_quantities
        description: >
          Wikidata's best-ranked quantity statements for the crosswalked items, as the SPARQL query returned them, every
          column as text (ADR 0043). Empty when no snapshot has been downloaded.
        columns:
          - name: item
            data_tests: [not_null]
          - name: property
            data_tests: [not_null]
          - name: amount
            data_tests: [not_null]
      - name: suppressed_records
        description: >
          Upstream records left out of the build because they don't belong: a duplicate, bad coordinates, the wrong
          mineral (data/suppressions/suppressed_records.csv, ADR 0034). Not for unwelcome history.
        columns:
          - name: dataset
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [mrds, wikidata, pleiades]
          - name: record_id
            data_tests: [not_null]
          - name: reason
            data_tests: [not_null]
      - name: reference_candidates
        description: >
          What OpenAlex and Crossref hold for each work the curated layer cites, as downloaded (ADR 0047): a few
          candidates per lookup, by DOI or by searching, or one row saying the lookup found nothing; and one row per
          cited link, with the HTTP status it answered. Every column as text. Which candidate is the work is dbt's call.
        columns:
          - name: service
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [openalex, crossref, link]
          - name: lookup
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [doi, search, link]
          - name: query
            data_tests: [not_null]
          - name: status
            data_tests: [not_null]
      - name: github_reports
        description: >
          The repository's open GitHub issues labelled `report`, as downloaded (ADR 0050): each issue's number, link,
          title and date, and the fields the app's report link filled in (the fact, its kind, a reference's citation, the
          agent run). Every column as text; a field left empty is ''. Who reported it, and what they wrote, stay on
          GitHub.
        columns:
          - name: number
            data_tests: [unique, not_null]
          - name: url
            data_tests: [not_null]
      - name: upstream_snapshots
        description: >
          One row per upstream dataset loaded, with where and when it was retrieved, for provenance, and the release it
          is for a dataset published in numbered releases (Cliopatria).
        columns:
          - name: dataset
            data_tests: [unique, not_null]
          - name: retrieved_at
            data_tests: [not_null]
