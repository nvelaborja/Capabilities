version: 2

models:
  - name: stg_curated__documents
    description: Curated documents with their common fields as columns.
    columns:
      - name: kind
        data_tests: [not_null]
      - name: label
        description: Every node has a label; overrides and dates aren't nodes, and have none.
        data_tests:
          - not_null:
              config:
                where: "node_type not in ('override', 'date')"
  - name: stg_github__reports
    description: Readers' open reports from GitHub issues, typed, with empty fields as nulls.
    columns:
      # Only the number is tested: the rest is what a reader typed, and a typo in it mustn't stop the build.
      - name: number
        data_tests: [unique, not_null]
  - name: stg_mrds__deposits
    description: MRDS deposits with typed columns, and their ore minerals and commodities as lists.
    columns:
      - name: record_id
        data_tests: [unique, not_null]
      - name: first_production_qualifier
        data_tests:
          - accepted_values:
              arguments:
                values: [before, after]
  - name: stg_cliopatria__polities
    description: Cliopatria's borders, typed, with empty fields as nulls and polygons as geometries (ADR 0052).
    columns:
      - name: name
        data_tests: [not_null]
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values: [POLITY, RELATION]
  - name: stg_curated__profile_places
    description: Each profile's Cliopatria entity and years, for profiles that have a place (ADR 0052).
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: cliopatria
        data_tests: [not_null]
      - name: from_year
        data_tests: [not_null]
      - name: to_year
        data_tests: [not_null]
