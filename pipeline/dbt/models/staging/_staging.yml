version: 2

models:
  - name: stg_curated__documents
    description: Curated documents with their common fields as columns.
    columns:
      - name: kind
        data_tests: [not_null]
      - name: label
        description: Every node has a label; overrides aren't nodes, and have none.
        data_tests:
          - not_null:
              config:
                where: "node_type <> 'override'"
  - name: stg_mrds__deposits
    description: MRDS deposits with typed columns, and their ore minerals and commodities as lists.
    columns:
      - name: record_id
        data_tests: [unique, not_null]
      - name: first_production_qualifier
        data_tests:
          - accepted_values:
              arguments:
                values: [before, after]
