version: 2

models:
  - name: graph_nodes
    description: Every node in the graph, as the app reads it (build/graph/graph_nodes.parquet).
    columns:
      - name: ordinal
        data_tests: [unique, not_null]
      - name: id
        description: Unique across every type of node (ADR 0004 data rules).
        data_tests: [unique, not_null]
      - name: provenance
        data_tests: [not_null]
  - name: graph_facts
    description: >
      Where each quantity value in the graph comes from (build/graph/graph_facts.parquet, ADR 0043): one row per thing
      and quantity, with the value used (an override, else the upstream value, else the curated one) and the others.
    columns:
      - name: id
        description: The thing and the field, as hematite/quantities.hardness_mohs. One value per field.
        data_tests: [unique, not_null]
      - name: node_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('graph_nodes')
                field: id
      - name: field
        data_tests: [not_null]
      - name: layer
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [curated, upstream, override]
      - name: value
        data_tests: [not_null]
  - name: curation_queue
    description: >
      The gaps the build finds, as a to-do list (build/graph/curation_queue.parquet, ADR 0045): readers' reports
      from GitHub issues, first (ADR 0050), places inside a profile's area that a cited date would make a yes (ADR
      0052), ore candidates from
      MRDS, extracted materials with no route, sources with no places, routes with only unverified references, upstream
      disagreements, stale overrides, works not yet read (ADR 0047), and Pleiades places no rule matches.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [reported, date_unknown, ore_candidate, extracted_without_route, source_without_places, route_unverified, upstream_disagreement, stale_override, unread_reference, unmatched_place]
      - name: detail
        data_tests: [not_null]
  - name: source_occurrences
    description: >
      Where each source kind is found: one row per source kind and located upstream record, with a point geometry
      (build/graph/source_occurrences.parquet, GeoParquet; ADR 0036, ADR 0041).
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('graph_nodes')
                field: id
      - name: geometry
        data_tests: [not_null]
      - name: dataset
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mrds, pleiades]
      - name: state
        description: >
          worked (MRDS: known to be worked by worked_by_year; Pleiades: an ancient mine or quarry, attested from
          attested_from to attested_to; or a curated date says so) or present (no known working date).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [worked, present]
      - name: worked_by_year
        description: >
          The year it is known to have been worked by, signed (negative is BCE, no year 0; ADR 0051), and
          worked_by_basis says where it came from.
      - name: worked_by_basis
        description: >
          first production (MRDS), period (the end of the Pleiades place's earliest dated period, named in
          worked_by_note), or curated (a date in data/dates, worked_by_date, whose reason is worked_by_note; what the
          dataset said is upstream_worked_by_year). Null when there is no year.
        data_tests:
          - accepted_values:
              arguments:
                values: [first production, period, curated]
          - not_null:
              config:
                where: "worked_by_year is not null"
      - name: worked_by_period_end
        description: >
          The end of the period that dated a Pleiades place. Later than worked_by_year when the period hadn't ended
          when the places snapshot was taken (Modern, to 2100), and its end was taken as that year (ADR 0051).
        data_tests:
          - not_null:
              config:
                where: "worked_by_basis = 'period'"
      - name: upstream_worked_by_note
        description: >
          With a curated date, the note the dataset's year came with (for Pleiades, the period it was the end of), kept
          beside upstream_worked_by_year.
      - name: provenance
        data_tests: [not_null]
  - name: profile_areas
    description: >
      Each profile's area (build/graph/profile_areas.parquet, ADR 0052): the union of its Cliopatria entity's polygons
      in the rows whose years overlap the profile's (for a profile generated for a Seshat polity, the rows that give
      its Seshat id, ADR 0053), with the years those rows cover, the Cliopatria release, and the
      area as GeoJSON for the map.
    columns:
      - name: id
        description: The profile's id; a generated one's is seshat-<the Seshat polity> (ADR 0053).
        data_tests: [unique, not_null]
      - name: origin
        description: curated (a profile in data/profiles with a place), or seshat (generated for a polity Seshat codes).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [curated, seshat]
      - name: geojson
        data_tests: [not_null]
  - name: history_codings
    description: >
      What Seshat says each generated profile's polity had (build/graph/history_codings.parquet, ADR 0053): one row
      per polity and compared variable, present if coded present in any of its years, else absent if coded absent,
      else unknown; with Seshat's tags, whether it is disputed, and the codings' record ids. CC BY-SA 4.0, kept in the
      build only.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: history
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [present, absent, unknown]
  - name: profile_occurrences
    description: >
      The occurrences inside each profile's area (build/graph/profile_occurrences.parquet, ADR 0052), and whether each
      was worked by the profile's last year. The map marks them; profile_sources counts them.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: occurrence_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('source_occurrences')
                field: id
  - name: profile_sources
    description: >
      Which sources each profile had, from the map (build/graph/profile_sources.parquet, ADR 0052): one row per profile
      and source kind with occurrences inside its area. yes when one was worked by the profile's last year, maybe when
      none is known to have been, with how many of each and a few examples. A source kind with nothing inside has no row.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: availability
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['yes', maybe]
      - name: source_kind
        description: source, or category for an ore class (a mine that doesn't say which ore); only sources can be selected.
        data_tests: [not_null]
  - name: reference_checks
    description: >
      Every work the graph cites, checked against OpenAlex and Crossref (build/graph/reference_checks.parquet, ADR 0047):
      the best candidate for it and how sure the match is, a free copy where OpenAlex knows one, and whether each link
      cited for it still loads. It never changes a reference's status.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: citation
        data_tests: [unique, not_null]
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [found, review_found, possible, not_found, doi_disagrees, not_searched, not_checked_yet]
      - name: cited_by
        data_tests: [not_null]
