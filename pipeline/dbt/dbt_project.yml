# Builds the graph the app reads (ADR 0038). Run through `uv run capabilities build` or Dagster, which load the raw tables first.
name: capabilities
version: "0.1.0"
config-version: 2
profile: capabilities

model-paths: ["models"]

flags:
  send_anonymous_usage_stats: false

models:
  capabilities:
    # meta.dagster.group: the group each layer's assets appear in when Dagster runs the project.
    staging:
      +materialized: view
      +meta: {dagster: {group: staging}}
    marts:
      # Marts are written as Parquet files in the build's graph/ directory: the artifact the app reads.
      +materialized: external
      +format: parquet
      +meta: {dagster: {group: marts}}
