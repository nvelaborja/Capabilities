[project]
name = "capabilities-pipeline"
version = "0.1.0"
description = "Builds the Capabilities graph from the curated layer (and, later, upstream datasets) with dbt (ADR 0034)."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "capabilities",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
]

[tool.uv.sources]
capabilities = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capabilities_pipeline"]
