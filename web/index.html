<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore what it takes to make and do things, and what else a group could have made." />
    <title>Capabilities</title>
    <script>
      // Apply a saved theme before the first paint, so the page never flashes the wrong one (see src/state/theme.ts).
      try {
        const theme = localStorage.getItem("capabilities.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
