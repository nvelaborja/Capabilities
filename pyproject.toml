[project]
name = "capabilities"
version = "0.1.0"
description = "An open knowledge graph of what it takes to make and do things, with a reasoner, CLI, and local API server."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "data/LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
capabilities = "capabilities.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capabilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
