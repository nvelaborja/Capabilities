# The workspace root holds no package of its own (ADR 0033): `uv sync` installs every member below.
[tool.uv.workspace]
members = ["packages/core", "packages/api"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/api/tests"]
# Test files in different packages share names' namespace otherwise; importlib mode needs no __init__.py files.
addopts = ["--import-mode=importlib"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
