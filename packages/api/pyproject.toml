[project]
name = "capabilities-api"
version = "0.1.0"
description = "The local API server for Capabilities, which also hosts the web app."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "capabilities",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[tool.uv.sources]
capabilities = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capabilities_api"]
