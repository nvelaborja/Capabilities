[project]
name = "capabilities"
version = "0.1.0"
description = "A free, non-commercial knowledge graph of what it takes to make and do things: the graph, reasoner, validator and CLI."
requires-python = ">=3.12"
# Code under PolyForm Noncommercial 1.0.0; the data it reads is CC BY-NC-SA 4.0 (ADR 0037). See LICENSE at the repo root.
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.scripts]
capabilities = "capabilities.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capabilities"]
